<!DOCTYPE html>
<html>
<head>
    <title>Lista de Dispositivos</title>
</head>
<body>
    <h1>Lista de Dispositivos</h1>
    <ul>
        {% for dispositivo in dispositivos %}
            <li>{{ dispositivo.nomenclatura }} - {{ dispositivo.tipo_dispositivo }}</li>
        {% empty %}
            <li>No hay dispositivos registrados.</li>
        {% endfor %}
    </ul>
    <p><a href="{% url 'inventario:dispositivo_new' %}">Crear Nuevo Dispositivo</a></p>
</body>
</html>
