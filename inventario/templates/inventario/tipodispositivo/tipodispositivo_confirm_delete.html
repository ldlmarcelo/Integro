<!DOCTYPE html>
<html>
<head>
    <title>Confirmar Borrar Tipo de Dispositivo</title>
</head>
<body>
    <h1>Confirmar Borrar Tipo de Dispositivo</h1>
    <p>¿Estás seguro de que quieres borrar el tipo de dispositivo: <strong>{{ tipo_dispositivo.nombre }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar Borrar</button>
        <a href="{% url 'inventario:tipodispositivo_list' %}">Cancelar</a>
    </form>
</body>
</html>
